<style>
/* Móvil primero: cabecera fija, resumen, buscador con lector, lista de variantes y hojas inferiores. Misma paleta verde/violeta de la herramienta de carga masiva. */
:root{
  --bg:#f5f8f7; --surface:#ffffff; --surface2:#f3f6f6; --ink:#0f172a; --muted:#5b6678; --line:#e3e8ec; --line2:#edf1f3;
  --accent:#0e8a4f; --accent-ink:#ffffff; --accent-soft:#e2f6ec; --blue:#2f6df0; --blue-soft:#e9f1ff; --violet:#6a4de8; --violet-soft:#f0edff;
  --bad:#c92a2a; --bad-soft:#fde8e8; --warn:#a85d00; --warn-soft:#fff0d6; --good:#0e8a4f; --good-soft:#dff5e8;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.08); --scrim:rgba(15,23,42,.45);
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1210; --surface:#141c19; --surface2:#1a2420; --ink:#e7f0ec; --muted:#98a8a1; --line:#263530; --line2:#1f2c27;
  --accent:#34d399; --accent-ink:#04251a; --accent-soft:#12382a; --blue:#8db0ff; --blue-soft:#18264a; --violet:#b3a2ff; --violet-soft:#241f4d;
  --bad:#ff8a8a; --bad-soft:#401a22; --warn:#ffbe5c; --warn-soft:#41300f; --good:#5fd596; --good-soft:#12382a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#141c19; --surface2:#1a2420; --ink:#e7f0ec; --muted:#98a8a1; --line:#263530; --line2:#1f2c27;
  --accent:#34d399; --accent-ink:#04251a; --accent-soft:#12382a; --blue:#8db0ff; --blue-soft:#18264a; --violet:#b3a2ff; --violet-soft:#241f4d;
  --bad:#ff8a8a; --bad-soft:#401a22; --warn:#ffbe5c; --warn-soft:#41300f; --good:#5fd596; --good-soft:#12382a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{-webkit-tap-highlight-color:transparent}
button,label,select,summary{-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin-inline:auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px}
.bar{display:flex;align-items:center;gap:2px;padding:2px 0 2px}
.brand{flex:1;min-width:0;margin-right:6px;display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand b em{font-style:normal;color:var(--accent)}
.brand span{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font-family:var(--f-mono);font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;font-size:11px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.ib{transition:transform .12s ease-out}
.ib:active{transform:scale(.88)}
.ib.spin svg{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile{border-radius:12px;padding:10px 14px;background:var(--violet-soft);display:flex;flex-direction:column}
.tile:nth-child(2){background:var(--accent-soft)}
.tile b{font-family:var(--f-mono);font-weight:500;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button b{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(15,23,42,.14);color:var(--ink)}
.seg button.w[aria-pressed="true"] b{color:var(--warn)}
.seg button.x[aria-pressed="true"] b{color:var(--bad)}

.search{display:flex;gap:8px;margin-top:12px}
.search .f{flex:1;min-width:0;position:relative}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 40px 0 14px;font-size:16px}
.search input[type=search]{-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search input::-ms-clear{display:none}
.search input::placeholder{color:var(--muted)}
.clr{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:20px;border-radius:10px}
.scanbtn{height:48px;width:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.scanbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.filters select{width:100%;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:13.5px;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted);margin:12px 2px 8px;display:flex;justify-content:space-between;gap:10px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:68px}
.item{transition:transform .14s ease-out,box-shadow .14s ease-out;will-change:transform;user-select:none;-webkit-user-select:none}
.item:active{transform:scale(.97);box-shadow:inset 0 2px 6px rgba(15,23,42,.10)}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .sk{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:1px}
.stk{flex:none;min-width:58px;border-radius:10px;padding:6px 8px;text-align:center;background:var(--good-soft);color:var(--good)}
.stk b{display:block;font-family:var(--f-mono);font-weight:500;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stk span{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.stk.low{background:var(--warn-soft);color:var(--warn)}
.stk.out{background:var(--bad-soft);color:var(--bad)}
.more{margin:12px auto 0;display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:500;min-height:44px}

.empty{margin-top:24px}
.empty h2{margin:0 0 6px;font-size:17px}
.empty ol{margin:10px 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.empty p{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}


.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .28s ease;will-change:opacity}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin-inline:auto;max-width:640px;max-height:90%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet{touch-action:pan-y;transform:translate3d(0,100%,0);transition:transform .34s cubic-bezier(.22,.9,.28,1);will-change:transform;backface-visibility:hidden;contain:layout paint}
.sheet.in{transform:translate3d(0,0,0)}
.sheet.drag{transition:none!important}
.scrim.drag{transition:none!important}
.sheet .grab{padding:10px 0;margin:-8px auto 2px;background:transparent;height:auto;width:100%;display:flex;justify-content:center}
.sheet .grab::before{content:"";width:42px;height:4px;border-radius:2px;background:var(--line)}
.sheet .grab-old{width:42px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.sh{display:flex;gap:10px;align-items:flex-start}
.sh h2{flex:1;min-width:0;margin:0;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.sh .x{flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:20px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{display:flex;align-items:center;gap:14px}
.big .stk{min-width:92px;padding:10px}
.big .stk b{font-size:34px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.kv dd.mono{font-size:13.5px}
.prices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prices div{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:8px 12px}
.prices span{display:block;font-size:11.5px;color:var(--muted)}
.prices b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.bc{background:#fff;border-radius:10px;padding:8px;text-align:center;border:1px solid var(--line)}
.bc canvas{max-width:100%;height:auto;display:block;margin:0 auto}
.reveal{border:0;background:none;color:var(--blue);font-weight:600;padding:0;min-height:32px}
input.txt{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-family:var(--f-mono);font-size:14px}
textarea{width:100%;min-height:96px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px;font-family:var(--f-mono);font-size:12.5px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:10px}

.scan{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .shade{position:absolute;inset:0;background:radial-gradient(ellipse 80% 26% at 50% 45%,transparent 60%,rgba(0,0,0,.6) 100%)}
.scan .frame{position:absolute;left:50%;top:45%;width:min(82vw,420px);height:min(34vw,150px);min-height:110px;transform:translate(-50%,-50%);border:2px solid #34d399;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan .frame::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:#ff5d5d;opacity:.85}
.scan .tp{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.scan .tp b{font-size:17px}
.scan .bt{position:relative;margin-top:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.75) 40%)}
.scan .msg{font-size:14px;max-width:420px}
.scan .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.scan .btn.primary{background:#34d399;color:#04251a;border-color:#34d399}
.scan .x{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;font-size:22px}
.manual{display:flex;gap:8px;width:min(100%,420px)}
.manual input{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);color:#fff;padding:0 12px;font-size:16px}

.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:14px}
.toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700;padding:4px 6px;min-height:32px}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.item,.ib{transition:none!important}.item:active{transform:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand"><b>Stock, <em>Comic Shop</em></b><span>Inventario en el teléfono · <span class="ver" title="Versión de la app móvil">v8</span></span></div>
      <button class="ib" id="bSync" type="button" aria-label="Actualizar inventario desde GitHub"><svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-14.7 5.8L3.5 15.5"/><path d="M3.5 12a8.5 8.5 0 0 1 14.7-5.8l2.3 2.3"/><path d="M20.5 3.5v5h-5M3.5 20.5v-5h5"/></svg></button>
      <button class="ib" id="bTheme" type="button" aria-label="Cambiar entre modo claro y oscuro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg></button>
      <button class="ib" id="bData" type="button" aria-label="Cargar o actualizar datos"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 14v4.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V14"/></svg></button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="seg" id="seg" role="group" aria-label="Estado del stock"></div>
    <div class="search">
      <div class="f"><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nombre, SKU o código"><button class="clr" id="qc" type="button" aria-label="Borrar búsqueda" hidden>×</button></div>
      <button class="scanbtn" id="bScan" type="button" aria-label="Escanear código de barras"><svg viewBox="0 0 24 24"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg></button>
    </div>
    <div class="filters">
      <select id="fCat" aria-label="Categoría"></select>
      <select id="fBrand" aria-label="Marca"></select>
      <select id="fSort" aria-label="Orden"><option value="name">A–Z</option><option value="lo">Menos stock</option><option value="hi">Más stock</option><option value="sku">Por SKU</option></select>
    </div>
  </header>

  <main>
    <div class="meta" id="meta"></div>
    <ul class="list" id="list"></ul>
    <button class="more" id="more" type="button" hidden></button>
    <section class="empty" id="empty" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-label="Detalle del producto" hidden></section>
<section class="sheet" id="data" role="dialog" aria-modal="true" aria-label="Datos del inventario" hidden></section>

  <video id="vid" playsinline muted></video>

  </div>
</section>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const KEY='comicshop-stock-movil-v1',TKEY='comicshop-stock-theme';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- datos ---------- */
let D={rows:[],at:0,file:'',ver:''};
const RKEY='comicshop-stock-repo';let REPO=store.get(RKEY)||'kdnaskrlos/App-Inventario';
let F={q:'',st:'all',cat:'',brand:'',sort:'name',shown:80};
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').trim().replace(',','.'));return isFinite(n)?n:0};
const fmtN=n=>{const r=Math.round(n*100)/100;return r.toLocaleString('es-VE',{maximumFractionDigits:2})};
const str=v=>v==null?'':(typeof v==='number'&&Number.isInteger(v)?String(v):String(v).trim());
function checkDigit(b){let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return (10-s%10)%10}
function toEan(code,base){const nz=x=>str(x).replace(/\.0+$/,'');code=nz(code);base=nz(base);

function parseTable(aoa){

  if(h<0)throw new Error('No encontré las columnas «sku» y «name». Usa el archivo exportado desde la carga masiva.');
  const head=aoa[h].map(x=>norm(x).trim()),ix=n=>head.indexOf(n);
  const c={sku:ix('sku'),name:ix('name'),desc:ix('description'),cat:ix('category'),brand:ix('brand'),model:ix('model'),ref:ix('reference'),cost:ix('cost'),
    p1:ix('price'),p2:ix('price2'),p3:ix('price3'),p4:ix('price4'),bc:ix('barcode'),ln:ix('location_name'),la:ix('location_aisle'),ls:ix('location_shelf'),
    fi:ix('location_fiscalstock'),nf:ix('location_nonfiscalstock'),mn:ix('location_minstock'),sz:ix('sizes')};

    rows.push({s:sku,n:str(g(a,c.name)),d:str(g(a,c.desc)),c:str(g(a,c.cat)),b:str(g(a,c.brand)),m:str(g(a,c.model)),r:str(g(a,c.ref)),k:num(g(a,c.cost)),
      p:[num(g(a,c.p1)),num(g(a,c.p2)),num(g(a,c.p3)),num(g(a,c.p4))],e:toEan(g(a,c.bc),g(a,c.base)),
      fi:num(g(a,c.fi)),nf:num(g(a,c.nf)),mn:num(g(a,c.mn)),l:[str(g(a,c.ln)),str(g(a,c.la)),str(g(a,c.ls))],z:str(g(a,c.sz))})}

function parseTSV(t){const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];

    else if(ch==='"'&&cur==='')q=true;else if(ch==='\t'){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}else cur+=ch}

let syncing=false,lastTry=0;
async function fetchRemote(){
  const urls=[[`https://api.github.com/repos/${REPO}/contents/data/inventario.json`,{headers:{'Accept':'application/vnd.github.raw+json'},cache:'no-store'}],['data/inventario.json',{cache:'no-store'}],['../data/inventario.json',{cache:'no-store'}]];
  let status=0;
  for(const [u,o] of urls){try{const res=await fetch(u,o);if(res.ok)return await res.json();status=res.status}catch(e){}}
  const e=new Error('sync');e.status=status;throw e}
async function sync(manual){
  if(syncing)return;syncing=true;lastTry=Date.now();const b=$('#bSync');b.classList.add('spin');
  try{const j=await fetchRemote();
    if(!j||!Array.isArray(j.rows)||!Array.isArray(j.head))throw new Error('formato');
    if(!j.rows.length){if(manual)toast('El repositorio todavía no tiene inventario guardado.');return}
    if(j.at&&j.at===D.ver){D.synced=Date.now();if(manual)toast('Ya tienes el inventario más reciente.');render();return}
    const rows=parseTable([j.head,...j.rows]);const prev=D;
    D={rows,at:Date.now(),file:'GitHub · '+REPO,ver:j.at||''};save();build();render();
    toast(prev.rows.length?`Inventario actualizado: ${fmtN(rows.length)} variantes.`:`${fmtN(rows.length)} variantes cargadas desde GitHub.`)}
  catch(e){if(manual||!D.rows.length)toast(e.status===404?'Aún no hay inventario guardado en ese repositorio. Súbelo desde la carga masiva.':'No se pudo actualizar. Revisa la conexión; verás los últimos datos guardados.')}

async function openScan(){

    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    const v=$('#vid');v.srcObject=stream;await v.play();msg.textContent='Centra el código de barras dentro del recuadro.';$('#frame').hidden=false;tick()}

function lookup(raw,fromScan){const c=str(raw).replace(/\s/g,'');if(!c)return;const dig=c.replace(/\D/g,'');

  const cp=t.closest('[data-copy]');if(cp){copy(cp.dataset.copy,cp.dataset.l);return}
  const co=t.closest('[data-cost]');if(co){co.outerHTML=`<b class="mono">${esc(co.dataset.cost)}</b>`;return}
  const a=t.closest('[data-act]');if(a){const k=a.dataset.act;
    if(k==='close')hideSheets();else if(k==='data')openData();else if(k==='demo')demo();else if(k==='sync2'){sync(true)}else if(k==='sync'){const v=$('#repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');if(!/^[\w.-]+\/[\w.-]+$/.test(v)){toast('Escribe el repositorio como usuario/nombre.');return}REPO=v;store.set(RKEY,v);D.ver='';hideSheets();sync(true)}else if(k==='paste')pasted();
    else if(k==='wipe'){if(a.dataset.sure){const prev=D;D={rows:[],at:0,file:''};store.del(KEY);F={q:'',st:'all',cat:'',brand:'',sort:'name',shown:80};$('#q').value='';hideSheets();build();render();toast('Datos borrados de este teléfono.','Deshacer',()=>{D=prev;save();build();render()})}else{a.dataset.sure='1';a.textContent='Toca otra vez para confirmar el borrado'}}
    return}});

/* ---------- bajar la hoja con un gesto ---------- */
function swipeClose(sh){let y0=0,dy=0,off=0,t0=0,on=false,can=false,raf=0;const sc=$('#scrim');
  const paint=()=>{raf=0;const d=Math.max(0,dy-off);sh.style.transform=`translate3d(0,${d}px,0)`;sc.style.opacity=String(Math.max(0,1-d/(sh.offsetHeight||600)))};
  const release=()=>{cancelAnimationFrame(raf);raf=0;sh.classList.remove('drag');sc.classList.remove('drag');sh.style.transform='';sc.style.opacity=''};
  sh.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;y0=e.touches[0].clientY;t0=Date.now();dy=0;off=0;on=false;can=sh.scrollTop<=0||!!e.target.closest('.grab,.sh')},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!can)return;dy=e.touches[0].clientY-y0;
    if(!on){if(dy>8&&sh.scrollTop<=0){on=true;off=dy;sh.classList.add('drag');sc.classList.add('drag')}else if(dy<-4){can=false;return}else return}
    e.preventDefault();if(!raf)raf=requestAnimationFrame(paint)},{passive:false});
  const end=()=>{if(!on)return;on=false;const d=dy-off,v=d/Math.max(1,Date.now()-t0);
    if(d>110||(d>40&&v>.5)){release();hideSheets()}else release()};
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',()=>{if(on){on=false;release()}})}
document.querySelectorAll('.sheet').forEach(swipeClose);
$('#scrim').addEventListener('click',hideSheets);
$('#bData').onclick=openData;$('#bSync').onclick=()=>sync(true);$('#bScan').onclick=openScan;$('#scanX').onclick=closeScan;
$('#more').onclick=()=>{F.shown+=100;render()};
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{F.q=e.target.value;F.shown=80;render()},120)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(qt);F.q=e.target.value;const v=e.target.value.trim();if(/^\d{8,14}$/.test(v)||/^[A-Za-z0-9_.-]+$/.test(v)&&D.rows.some(r=>r.s.toLowerCase()===v.toLowerCase())){lookup(v)}else render();e.target.blur()}});
$('#qc').onclick=()=>{F.q='';$('#q').value='';render();$('#q').focus()};
$('#fCat').onchange=e=>{F.cat=e.target.value;F.shown=80;render()};$('#fBrand').onchange=e=>{F.brand=e.target.value;F.shown=80;render()};$('#fSort').onchange=e=>{F.sort=e.target.value;render()};
$('#photo').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';fromPhoto(f)});
$('#manual').addEventListener('submit',e=>{e.preventDefault();const v=$('#manualQ').value.trim();if(v){closeScan();lookup(v)}});
document.addEventListener('change',e=>{if(e.target.id==='file'){const f=e.target.files[0];e.target.value='';if(f)readFile(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#scan').hidden)closeScan();else if(openSheet)hideSheets()}});
$('#bTheme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const n=dark?'light':'dark';document.documentElement.dataset.theme=n;store.set(TKEY,n)};
{const t=store.get(TKEY);if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}
window.addEventListener('pagehide',stopCam);

load();build();render();
sync(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastTry>120000)sync(false)});
if('serviceWorker' in navigator&&/^https:/.test(location.protocol)&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.__app={lookup,parseTable,parseTSV,toEan,eanBits,D:()=>D};
})();
